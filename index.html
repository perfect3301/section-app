        }
        return cv;
      });
    }

    return { ...sc, camera: newCam, segments, vertices, curves, _overrideViewDir: vDir, _origScene: sc };
  }

  function sceneProjector(sc, w, h) {
    const rawSc = sc._origScene || sc;
    const pts = [];
    (sc.vertices || []).forEach(v => pts.push(v.pos));
    (sc.segments || []).forEach(s => { pts.push(s.a); pts.push(s.b); });
    (sc.polygons || []).forEach(pg => pg.pts.forEach(p => pts.push(p)));
    (sc.curves || []).forEach(cv => sceneCurvePoints(sc, cv).forEach(p => pts.push(p)));
    let raw = pts.map(p => sceneRawProj(sc, p));
    if (!raw.length) raw = [[0, 0], [1, 1]];
    let xs = raw.map(p => p[0]), ys = raw.map(p => p[1]);
    if (sc.dimension === '2d' && sc.camera.bounds_2d) {
      const [x0, y0, x1, y1] = sc.camera.bounds_2d;
      xs = [x0, x1]; ys = [-y1, -y0];
    }
    const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
    const bw = Math.max(1e-9, maxX - minX), bh = Math.max(1e-9, maxY - minY);
    const m = 0.08;
    let s = Math.min(w * (1 - 2 * m) / bw, h * (1 - 2 * m) / bh);
    let cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

    if (sc._origScene && sc.dimension === '3d') {
      // Стабилизируем центр и масштаб при 3D-вращении, чтобы фигура не «прыгала» в размерах
      const { c, r } = getSceneCenterAndRadius(rawSc);
      const c2 = sceneRawProj(sc, c);
      cx = c2[0]; cy = c2[1];
      const cCam = sc.camera;
      const maxGain = Math.max(
        Math.hypot(cCam.e1[0], cCam.e1[1]),
        Math.hypot(cCam.e2[0], cCam.e2[1]),
        Math.hypot(cCam.e3[0], cCam.e3[1])
      ) || 1;
      const safeScale = Math.min(w * (1 - 2 * m), h * (1 - 2 * m)) / Math.max(1e-6, 2 * r * maxGain * 1.05);
      const baseP = sceneProjector(rawSc, w, h);
      s = Math.min(baseP.scale, Math.max(safeScale, s * 0.85));
    }

    const tx = w / 2 - cx * s, ty = h / 2 - cy * s;
    const P = p => { const r = sceneRawProj(sc, p); return [r[0] * s + tx, r[1] * s + ty]; };
    P.aspect = bh / bw;
    P.scale = s;
    return P;
  }

  function sceneStyle(Pl, style, scale) {
    if (style === 'section' || style === 'main') return { col: Pl.poly, lw: 2.6 * scale };
    if (style === 'aux') return { col: Pl.trace, lw: 1.5 * scale };
    if (style === 'ref_line') return { col: Pl.trace, lw: 1.0 * scale };
    if (style === 'edge_hid') return { col: Pl.edgeHid, lw: 1.25 * scale };
    return { col: Pl.edgeVis, lw: 1.75 * scale };
  }

  function renderSceneToContext(c, w, h, isExport) {
    const sc = getRotatedScene(state.renderScene, view.yawDeg, view.pitchDeg);
    const Pl = curPal(), scale = Math.max(1, w / 650);
    const P = sceneProjector(sc, w, h);
    c.clearRect(0, 0, w, h);
    c.fillStyle = Pl.bg; c.fillRect(0, 0, w, h);
    const gs = 28 * Math.max(1, w / 840);
    c.save(); c.strokeStyle = Pl.grid; c.lineWidth = 1; c.beginPath();
    for (let gx = gs; gx < w; gx += gs) { c.moveTo(gx, 0); c.lineTo(gx, h); }
    for (let gy = gs; gy < h; gy += gs) { c.moveTo(0, gy); c.lineTo(w, gy); }
    c.stroke(); c.restore();

    const applyViewTransform = !isExport && (view.zoom !== 1 || view.panX !== 0 || view.panY !== 0);
    if (applyViewTransform) {
      c.save();
      c.translate(view.panX * w, view.panY * h);
      c.scale(view.zoom, view.zoom);
    }

    (sc.polygons || []).forEach(pg => {
      const pts = pg.pts.map(P);
      if (pts.length < 3) return;
      c.save(); c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath();
      c.fillStyle = pg.style === 'section' ? Pl.polyFill : (pg.style === 'plane2' ? Pl.planeFill2 : Pl.planeFill);
      c.fill();
      if (pg.style === 'section' && pg.hatch) {
        c.clip();
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), dg = y1 - y0, st = 11 * scale;
        c.beginPath();
        for (let sx = x0 - dg; sx <= x1 + st; sx += st) { c.moveTo(sx, y1); c.lineTo(sx + dg, y0); }
        c.lineWidth = 1.2 * scale; c.strokeStyle = Pl.hatch; c.stroke();
      }
      c.restore();
    });
    (sc.segments || []).forEach(sg => {
      const a = P(sg.a), b = P(sg.b), st = sceneStyle(Pl, sg.style, scale);
      const hidden = !sg.visible || sg.style === 'edge_hid' || sg.style === 'ref_line';
      c.save(); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
      c.setLineDash(hidden ? [6 * scale, 5 * scale] : []);
      if (sg.style === 'section' || sg.style === 'main') { c.lineWidth = st.lw + 2 * scale; c.strokeStyle = Pl.halo; c.stroke(); }
      c.lineWidth = st.lw; c.strokeStyle = st.col; c.stroke(); c.restore();
    });
    const viewDir = sc.dimension === '3d' ? sceneViewDir(sc) : null;
    (sc.curves || []).forEach(cv => {
      const st = sceneStyle(Pl, cv.style, scale);
      c.save(); c.strokeStyle = st.col; c.lineWidth = st.lw;
      if (cv.kind === 'right_angle_mark' && cv.p1 && cv.p2) {
        const o = P(cv.center), u0 = P(cv.p1), v0 = P(cv.p2), sz = Math.max(9, w / 75);
        const nu = Math.hypot(u0[0] - o[0], u0[1] - o[1]) || 1, nv = Math.hypot(v0[0] - o[0], v0[1] - o[1]) || 1;
        const u = [(u0[0] - o[0]) / nu * sz, (u0[1] - o[1]) / nu * sz], v = [(v0[0] - o[0]) / nv * sz, (v0[1] - o[1]) / nv * sz];
        c.beginPath(); c.moveTo(o[0] + u[0], o[1] + u[1]); c.lineTo(o[0] + u[0] + v[0], o[1] + u[1] + v[1]); c.lineTo(o[0] + v[0], o[1] + v[1]); c.stroke();
      } else if (sc.dimension === '3d') {
        const pts3 = sceneCircle3d(cv.center, cv.normal, cv.radius, 120);
        for (let i = 0; i + 1 < pts3.length; i++) {
          const mid = [0, 1, 2].map(k => (pts3[i][k] + pts3[i + 1][k]) / 2 - cv.center[k]);
          const back = cv.hide_back && viewDir && (mid[0] * viewDir[0] + mid[1] * viewDir[1] + mid[2] * viewDir[2]) < 0;
          const a = P(pts3[i]), b = P(pts3[i + 1]);
          c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
          c.setLineDash(back ? [5 * scale, 5 * scale] : []);
          c.strokeStyle = back ? Pl.edgeHid : st.col; c.stroke();
        }
      } else {
        const pts = sceneCurve2d(cv).map(P);
        c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke();
      }
      c.restore();
    });
    (sc.vertices || []).forEach(v => {
      const p = P(v.pos), isV = v.role === 'vertex', r = (isV ? 3 : 5) * scale;
      c.save();
      c.beginPath(); c.arc(p[0], p[1], r + 1.5 * scale, 0, Math.PI * 2); c.fillStyle = Pl.halo; c.fill();
      c.beginPath(); c.arc(p[0], p[1], r, 0, Math.PI * 2);
      const col = isV ? Pl.vLabel : Pl.point;
      if (v.visible) { c.fillStyle = col; c.fill(); } else { c.fillStyle = Pl.halo; c.fill(); c.lineWidth = 2 * scale; c.strokeStyle = col; c.stroke(); }
      c.restore();
      if (v.name && v.show_label !== false) drawLabel(c, v.name, p[0] + r + 5 * scale, p[1] - r - 3 * scale, col, scale, 12.5);
    });

    if (applyViewTransform) c.restore();
    if (isExport && !state.tier.isPro) drawWatermarkCanvas(c, w, h, state.tier.watermark || 'SECT_3D // CONSTRUCT');
    return { poly: [], steps: sc.steps || [], snapshots: [] };
  }

  function buildSceneSvg() {
    const sc = getRotatedScene(state.renderScene, view.yawDeg, view.pitchDeg), Pl = curPal();
    const w = 1400, h = Math.round(1400 * (state.imgH / state.imgW)), scale = Math.max(1, w / 650);
    const P = sceneProjector(sc, w, h);
    const f = v => (+v).toFixed(2);
    const out = [`<?xml version="1.0" encoding="UTF-8"?>`, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`,
      `<rect x="0" y="0" width="${w}" height="${h}" fill="${Pl.bg}" />`];
    (sc.polygons || []).forEach(pg => {
      const pts = pg.pts.map(P).map(p => `${f(p[0])},${f(p[1])}`).join(' ');
      const fill = pg.style === 'section' ? Pl.polyFill : (pg.style === 'plane2' ? Pl.planeFill2 : Pl.planeFill);
      out.push(`<polygon points="${pts}" fill="${fill}" />`);
    });
    (sc.segments || []).forEach(sg => {
      const a = P(sg.a), b = P(sg.b), st = sceneStyle(Pl, sg.style, scale);
      const dash = (!sg.visible || sg.style === 'edge_hid' || sg.style === 'ref_line') ? ` stroke-dasharray="${f(6 * scale)} ${f(5 * scale)}"` : '';
      out.push(`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${st.col}" stroke-width="${f(st.lw)}"${dash} stroke-linecap="round" />`);
    });
    const viewDir = sc.dimension === '3d' ? sceneViewDir(sc) : null;
    (sc.curves || []).forEach(cv => {
      const st = sceneStyle(Pl, cv.style, scale);
      if (cv.kind === 'right_angle_mark') return;
      if (sc.dimension === '3d') {
        const pts3 = sceneCircle3d(cv.center, cv.normal, cv.radius, 120);
        for (let i = 0; i + 1 < pts3.length; i++) {
          const mid = [0, 1, 2].map(k => (pts3[i][k] + pts3[i + 1][k]) / 2 - cv.center[k]);
          const back = cv.hide_back && viewDir && (mid[0] * viewDir[0] + mid[1] * viewDir[1] + mid[2] * viewDir[2]) < 0;
          const a = P(pts3[i]), b = P(pts3[i + 1]);
          out.push(`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${back ? Pl.edgeHid : st.col}" stroke-width="${f(st.lw)}"${back ? ` stroke-dasharray="${f(5 * scale)} ${f(5 * scale)}"` : ''} />`);
        }
      } else {
        const pts = sceneCurve2d(cv).map(P).map(p => `${f(p[0])},${f(p[1])}`).join(' ');
        out.push(`<polyline points="${pts}" fill="none" stroke="${st.col}" stroke-width="${f(st.lw)}" />`);
      }
    });
    (sc.vertices || []).forEach(v => {
      const p = P(v.pos), isV = v.role === 'vertex', r = (isV ? 3 : 5) * scale, col = isV ? Pl.vLabel : Pl.point;
      out.push(`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r)}" fill="${v.visible ? col : Pl.halo}" stroke="${col}" stroke-width="${f(1.6 * scale)}" />`);
      if (v.name && v.show_label !== false) out.push(`<text x="${f(p[0] + r + 5 * scale)}" y="${f(p[1] - r - 3 * scale)}" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${f(12.5 * scale)}" fill="${col}" stroke="${Pl.halo}" stroke-width="${f(4 * scale)}" paint-order="stroke">${escXml(v.name)}</text>`);
    });
    out.push('</svg>');
    return out.join('\n');
  }

  function sceneParamInputs() {
    const box = document.getElementById('sceneParams');
    box.innerHTML = '';
    const prog = state.sceneProgram;
    if (!prog || !Array.isArray(prog.nodes)) return;
    prog.nodes.forEach((node, ni) => {
      (node.params || []).forEach((prm, pi) => {
        const m = /^([a-z_0-9]+)=(-?[0-9]+(?:[.][0-9]+)?(?:\/[0-9]+)?|[0-9.*()+\-\/ ]*sqrt\([0-9]+\)[0-9.*()+\-\/ ]*)$/.exec(String(prm).trim());
        if (!m || ['n'].includes(m[1])) return;
        const lbl = document.createElement('label');
        lbl.className = 'param-lbl';
        lbl.textContent = `${node.id}.${m[1]}=`;
        const inp = document.createElement('input');
        inp.className = 'param-in';
        inp.value = m[2];
        inp.dataset.node = String(ni); inp.dataset.param = String(pi); inp.dataset.key = m[1];
        lbl.appendChild(inp);
        box.appendChild(lbl);
      });
    });
  }

  function setSceneAspect() {
    const P = sceneProjector(state.renderScene, 1000, 1000);
    state.imgW = 840;
    state.imgH = Math.max(360, Math.min(1260, Math.round(840 * (P.aspect || 0.7) * 1.08 + 60)));
  }

  function enterSceneMode(data) {
    state.renderScene = data.renderScene;
    state.sceneProgram = data.sceneProgram || null;
    state.sceneAnswer = data.renderScene.answer_text || '';
    setSceneAspect();
    document.querySelectorAll('.console-dock').forEach(el => { if (el.id !== 'scenePanel') el.style.display = 'none'; });
    const sb = document.querySelector('.shape-bar'); if (sb) sb.style.display = 'none';
    document.getElementById('scenePanel').style.display = 'flex';
    document.getElementById('scenePaperCb').checked = Boolean(document.getElementById('paperThemeCb').checked);
    rainCanvas.style.display = 'none';
    sceneParamInputs();
    document.getElementById('sceneRecalcBtn').disabled = !(apiBase && tg?.initData && state.sceneProgram);
    resetView(false);
  }

  function exitSceneMode() {
    state.renderScene = null; state.sceneProgram = null; state.sceneAnswer = '';
    document.querySelectorAll('.console-dock').forEach(el => { el.style.display = el.id === 'scenePanel' ? 'none' : 'flex'; });
    const sb = document.querySelector('.shape-bar'); if (sb) sb.style.display = 'flex';
    state.imgW = 840; state.imgH = 580;
    if (!state.img) rainCanvas.style.display = 'block';
    resetView(false);
    draw();
  }

  function drawSceneMode() {
    canvas.width = state.imgW; canvas.height = state.imgH;
    const res = renderSceneToContext(ctx, state.imgW, state.imgH, false);
    document.getElementById('sceneAnswer').textContent = state.sceneAnswer ? `ОТВЕТ: ${state.sceneAnswer}` : '';
    const zoomTag = Math.abs(view.zoom - 1) > 0.05 ? ` · ${view.zoom.toFixed(1)}×` : '';
    document.getElementById('hudStatus').textContent = 'СЦЕНА · ТОЧНО' + zoomTag;
    document.getElementById('hudShape').textContent = (state.renderScene.title || 'РЕШЕНИЕ').toUpperCase().slice(0, 24);
    document.getElementById('polyKindTag').textContent = '[ СЦЕНА ]';
    document.getElementById('stepPlayer').style.display = 'none';
    const list = document.getElementById('stepsList');
    list.innerHTML = (res.steps.length ? res.steps : ['Шагов нет']).map((s, i) =>
      `<li><span class="trace-idx">${String(i + 1).padStart(2, '0')}&gt;</span><span>${escXml(s)}</span></li>`).join('');
    document.getElementById('saveToChatBtn').style.display = 'none';
    document.getElementById('sendTgBtn').style.display = 'none';
    syncViewUi();
  }

  async function recalcScene() {
    if (!state.sceneProgram || !apiBase || !tg?.initData) return;
    const prog = JSON.parse(JSON.stringify(state.sceneProgram));
    document.querySelectorAll('#sceneParams .param-in').forEach(inp => {
      const ni = Number(inp.dataset.node), pi = Number(inp.dataset.param);
      prog.nodes[ni].params[pi] = `${inp.dataset.key}=${inp.value.trim()}`;
    });
    const btn = document.getElementById('sceneRecalcBtn');
    btn.disabled = true;
    setNetStatus('[ ПЕРЕСЧЁТ_НА_СЕРВЕРЕ... ]');
    try {
      const resp = await fetch(`${apiBase}/api/solve_preview`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, scene_program: prog })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      state.renderScene = data.scene;
      state.sceneProgram = prog;
      state.sceneAnswer = data.answer_text || '';
      setSceneAspect();
      draw();
      setNetStatus('[ ПЕРЕСЧИТАНО ]');
      setTimeout(() => setNetStatus(''), 1500);
    } catch (err) {
      setNetStatus(`[ ОШИБКА: ${err.message} ]`, true);
    } finally {
      btn.disabled = false;
    }
  }

  state.tier = { isPro: false, known: false, botUsername: '', watermark: 'SECT_3D // CONSTRUCT' };

  function applyTierUi() {
    const svgBtn = document.getElementById('exportSvgBtn');
    if (!svgBtn) return;
    svgBtn.innerHTML = state.tier.isPro ? '&gt; ЭКСПОРТ_SVG' : '&gt; ЭКСПОРТ_SVG [PRO]';
    svgBtn.classList.toggle('dim', !state.tier.isPro);
  }

  async function loadTierIfPossible() {
    if (!apiBase || !tg?.initData) { applyTierUi(); return; }
    try {
      const resp = await fetch(`${apiBase}/api/me`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        state.tier = {
          isPro: Boolean(data.isPro),
          known: true,
          botUsername: String(data.botUsername || ''),
          watermark: data.isPro ? null : (data.watermark || state.tier.watermark)

      }
    } catch (_) {}
    applyTierUi();
  }

  function drawWatermarkCanvas(c, w, h, text) {
    if (!text) return;
    const P = curPal();
    const fs = Math.max(11, Math.round(w / 66));
    c.save();
    c.font = `700 ${fs}px "JetBrains Mono", monospace`;
    const tw = c.measureText(text).width;
    const padX = Math.max(7, w / 120), padY = Math.max(4, h / 150), margin = Math.max(10, w / 70);
    const bx1 = w - margin, by1 = h - margin;
    const bx0 = bx1 - tw - 2 * padX, by0 = by1 - fs - 2 * padY;
    c.fillStyle = P.wmBg;
    c.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
    c.lineWidth = Math.max(1, w / 600);
    c.strokeStyle = P.wmBorder;
    c.strokeRect(bx0, by0, bx1 - bx0, by1 - by0);
    c.fillStyle = P.wmText;
    c.textBaseline = 'top';
    c.fillText(text, bx0 + padX, by0 + padY);
    c.restore();
  }

  function getRenderFlags() {
    return {
      taskOnly: document.getElementById('taskOnlyCb').checked,
      hideWire: document.getElementById('hideWireCb').checked,
      showTrace: document.getElementById('showTraceCb').checked,
      showHatch: document.getElementById('showHatchCb').checked,
      showLabels: document.getElementById('showLabelsCb').checked,
      greenFilter: document.getElementById('greenFilterCb').checked
    };
  }

  function resolveActiveStepData(res) {
    const flags = getRenderFlags();
    const { poly, knownPts, traces, traceNodes, snapshots } = res;

    if (flags.taskOnly) {
      const userPts = state.points.map((pt, i) => ({ p3: pt.p3, name: ptNames[i] || `P${i+1}` }));
      return {
        drawPoly: false,
        partialSegs: [],
        activeTraces: [],
        activeTraceNodes: [],
        activePts: userPts,
        hideWire: false
      };
    }

    const useSnap = state.playStep !== null && snapshots.length > 0 && state.playStep >= 0 && state.playStep < snapshots.length;
    if (useSnap) {
      const snap = snapshots[state.playStep];
      const traceSet = new Set(snap.traceNodes.map(t => t.name));
      return {
        drawPoly: snap.polyReady && poly.length >= 3,
        partialSegs: snap.polyReady ? [] : snap.segs,
        activeTraces: flags.showTrace ? snap.rays : [],
        activeTraceNodes: flags.showTrace ? snap.traceNodes : [],
        activePts: snap.pts.filter(kp => !traceSet.has(kp.name)),
        hideWire: flags.hideWire
      };
    }

    const traceSet = new Set(traceNodes.map(t => t.name));
    const fullPts = knownPts.length >= 3
      ? knownPts.filter(kp => !traceSet.has(kp.name))
      : state.points.map((pt, i) => ({ p3: pt.p3, name: ptNames[i] || `P${i+1}` }));

    return {
      drawPoly: poly.length >= 3,
      partialSegs: [],
      activeTraces: flags.showTrace ? traces : [],
      activeTraceNodes: flags.showTrace ? traceNodes : [],
      activePts: fullPts,
      hideWire: flags.hideWire
    };
  }

  function drawLabel(c, text, x, y, color, scale, size = 12.5) {
    c.save();
    c.font = `700 ${size*scale}px "JetBrains Mono", monospace`;
    c.lineWidth = 4 * scale;
    c.lineJoin = 'round';
    c.strokeStyle = curPal().halo;
    c.strokeText(text, x, y);
    c.fillStyle = color;
    c.fillText(text, x, y);
    c.restore();
  }

  function drawBracketReticle(c, x, y, r, color, scale) {
    const b = r * 0.48;
    c.save();
    c.strokeStyle = '#000000'; c.lineWidth = 4.2 * scale;
    c.beginPath();
    c.moveTo(x - r, y - r + b); c.lineTo(x - r, y - r); c.lineTo(x - r + b, y - r);
    c.moveTo(x + r - b, y - r); c.lineTo(x + r, y - r); c.lineTo(x + r, y - r + b);
    c.moveTo(x + r, y + r - b); c.lineTo(x + r, y + r); c.lineTo(x + r - b, y + r);
    c.moveTo(x - r + b, y + r); c.lineTo(x - r, y + r); c.lineTo(x - r, y + r - b);
    c.stroke();
    c.strokeStyle = color; c.lineWidth = 1.9 * scale; c.stroke();
    c.fillStyle = '#000000'; c.fillRect(x - 3*scale, y - 3*scale, 6*scale, 6*scale);
    c.fillStyle = color; c.fillRect(x - 1.8*scale, y - 1.8*scale, 3.6*scale, 3.6*scale);
    c.restore();
  }

  function drawSchoolPoint(c, px, py, visible, r, label, scale) {
    const P = curPal();
    c.save();
    c.beginPath(); c.arc(px, py, r + 1.5 * scale, 0, Math.PI * 2); c.fillStyle = P.halo; c.fill();
    c.beginPath(); c.arc(px, py, r, 0, Math.PI * 2);
    if (visible) {
      c.fillStyle = P.point; c.fill();
    } else {
      c.fillStyle = P.halo; c.fill();
      c.lineWidth = 2.1 * scale; c.strokeStyle = P.point; c.stroke();
    }
    c.restore();
    if (label) drawLabel(c, label, px + r + 5 * scale, py - r - 3 * scale, P.point, scale, 12.5);
  }

  function renderToContext(targetCtx, w, h, isExport = false) {
    if (state.renderScene) return renderSceneToContext(targetCtx, w, h, isExport);
    targetCtx.clearRect(0, 0, w, h);
    const flags = getRenderFlags();
    const P = curPal();

    if (!state.img) {
      if (isExport || P.paper) {
        targetCtx.fillStyle = P.bg;
        targetCtx.fillRect(0, 0, w, h);
      }
      const step = 28 * Math.max(1, w / 840);
      targetCtx.save();
      targetCtx.strokeStyle = P.grid;
      targetCtx.lineWidth = 1;
      targetCtx.beginPath();
      for (let gx = step; gx < w; gx += step) { targetCtx.moveTo(gx, 0); targetCtx.lineTo(gx, h); }
      for (let gy = step; gy < h; gy += step) { targetCtx.moveTo(0, gy); targetCtx.lineTo(w, gy); }
      targetCtx.stroke();
      targetCtx.restore();
    } else if (isExport || P.paper) {
      targetCtx.fillStyle = P.bg;
      targetCtx.fillRect(0, 0, w, h);
    }

    const applyViewTransform = !isExport && (view.zoom !== 1 || view.panX !== 0 || view.panY !== 0);
    if (applyViewTransform) {
      targetCtx.save();
      targetCtx.translate(view.panX * w, view.panY * h);
      targetCtx.scale(view.zoom, view.zoom);
    }

    if (state.img) {
      targetCtx.drawImage(state.img, 0, 0, w, h);
      if (flags.greenFilter) {
        targetCtx.save();
        targetCtx.globalCompositeOperation = 'multiply';
        targetCtx.fillStyle = '#00FF41';
        targetCtx.fillRect(0, 0, w, h);
        targetCtx.globalCompositeOperation = 'source-over';
        targetCtx.fillStyle = 'rgba(0, 255, 65, 0.10)';
        targetCtx.fillRect(0, 0, w, h);
        targetCtx.restore();
      }
    }

    const res = computeSection();
    const { geom, anchors, basis, faceVisible, edgeVisible, poly, segVis } = res;
    const active = resolveActiveStepData(res);
    const X = p => p.x * w, Y = p => p.y * h;
    const scale = Math.max(1, w / 650);
    const v2 = geom.v3.map(v => proj2D(v, basis));
    const hasPhoto = Boolean(state.img);

    if (active.drawPoly && poly.length >= 3) {
      const poly2 = poly.map(p => proj2D(p, basis));
      targetCtx.save();
      targetCtx.beginPath();
      poly2.forEach((p, i) => i === 0 ? targetCtx.moveTo(X(p), Y(p)) : targetCtx.lineTo(X(p), Y(p)));
      targetCtx.closePath();
      targetCtx.fillStyle = P.polyFill;
      targetCtx.fill();

      if (flags.showHatch) {
        targetCtx.save();
        targetCtx.clip();
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        poly2.forEach(p => {
          const px = X(p), py = Y(p);
          if (px < minX) minX = px; if (px > maxX) maxX = px;
          if (py < minY) minY = py; if (py > maxY) maxY = py;
        });
        const step = 11 * scale, diag = maxY - minY;
        targetCtx.beginPath();
        for (let sx = minX - diag; sx <= maxX + step; sx += step) {
          targetCtx.moveTo(sx, maxY);
          targetCtx.lineTo(sx + diag, minY);
        }
        targetCtx.lineWidth = 1.2 * scale;
        targetCtx.strokeStyle = P.hatch;
        targetCtx.stroke();
        targetCtx.restore();
      }
      targetCtx.restore();
    }

    if (!active.hideWire) {
      geom.edges.forEach(([i, j], idx) => {
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.moveTo(X(v2[i]), Y(v2[i]));
        targetCtx.lineTo(X(v2[j]), Y(v2[j]));
        if (!edgeVisible[idx]) targetCtx.setLineDash([5*scale, 5*scale]);
        if (hasPhoto) {
          targetCtx.lineWidth = (edgeVisible[idx] ? 3.4 : 2.6) * scale;
          targetCtx.strokeStyle = P.haloSoft;
          targetCtx.stroke();
        }
        targetCtx.lineWidth = (edgeVisible[idx] ? 1.75 : 1.25) * scale;
        targetCtx.strokeStyle = edgeVisible[idx] ? P.edgeVis : P.edgeHid;
        targetCtx.stroke();
        targetCtx.restore();
      });

      if (flags.showLabels) {
        geom.v3.forEach((_, i) => {
          drawLabel(targetCtx, geom.labels[i], X(v2[i]) + 6*scale, Y(v2[i]) - 6*scale, P.vLabel, scale, 12);
        });
      }
    }

    if (active.activeTraces.length > 0 || active.activeTraceNodes.length > 0) {
      targetCtx.save();
      for (const ray of active.activeTraces) {
        const a2 = proj2D(ray.a, basis), b2 = proj2D(ray.b, basis);
        targetCtx.beginPath();
        targetCtx.moveTo(X(a2), Y(a2));
        targetCtx.lineTo(X(b2), Y(b2));
        targetCtx.setLineDash(ray.visible ? [] : [4.5*scale, 4.5*scale]);
        if (hasPhoto) {
          targetCtx.lineWidth = 3.0 * scale;
          targetCtx.strokeStyle = P.haloSoft;
          targetCtx.stroke();
        }
        targetCtx.lineWidth = 1.5 * scale;
        targetCtx.strokeStyle = P.trace;
        targetCtx.stroke();
      }
      targetCtx.setLineDash([]);
      for (const tn of active.activeTraceNodes) {
        const p2 = proj2D(tn.p3, basis);
        drawSchoolPoint(targetCtx, X(p2), Y(p2), tn.visible, 4.5 * scale, tn.name, scale);
      }
      targetCtx.restore();
    }

    if (active.drawPoly && poly.length >= 3) {
      const poly2 = poly.map(p => proj2D(p, basis));
      targetCtx.save();
      poly2.forEach((a, i) => {
        const b = poly2[(i + 1) % poly2.length];
        targetCtx.beginPath();
        targetCtx.moveTo(X(a), Y(a));
        targetCtx.lineTo(X(b), Y(b));
        targetCtx.setLineDash(segVis[i] ? [] : [7*scale, 4.5*scale]);
        if (hasPhoto) {
          targetCtx.lineWidth = 4.6 * scale;
          targetCtx.strokeStyle = P.halo;
          targetCtx.stroke();
        }
        targetCtx.lineWidth = 2.6 * scale;
        targetCtx.strokeStyle = P.poly;
        targetCtx.stroke();
      });
      targetCtx.restore();
    } else if (active.partialSegs.length > 0) {
      targetCtx.save();
      active.partialSegs.forEach((seg) => {
        const a = proj2D(seg.a, basis), b = proj2D(seg.b, basis);
        targetCtx.beginPath();
        targetCtx.moveTo(X(a), Y(a));
        targetCtx.lineTo(X(b), Y(b));
        targetCtx.setLineDash(seg.visible ? [] : [7*scale, 4.5*scale]);
        if (hasPhoto) {
          targetCtx.lineWidth = 4.6 * scale;
          targetCtx.strokeStyle = P.halo;
          targetCtx.stroke();
        }
        targetCtx.lineWidth = 2.6 * scale;
        targetCtx.strokeStyle = P.poly;
        targetCtx.stroke();
      });
      targetCtx.restore();
    }

    active.activePts.forEach((kp) => {
      const p2 = proj2D(kp.p3, basis);
      const vis = geom.faces.some((f, fi) => faceVisible[fi] && isPointOnFace(kp.p3, f, geom));
      drawSchoolPoint(targetCtx, X(p2), Y(p2), vis, 5.2 * scale, kp.name, scale);
    });

    if (!isExport && state.mode === 'anchors') {
      anchors.forEach((a, idx) => {
        const vIdx = geom.anchors[idx];
        drawBracketReticle(targetCtx, X(a), Y(a), 10 * scale, '#00FF41', scale);
        drawLabel(targetCtx, geom.labels[vIdx], X(a) - 18*scale, Y(a) - 10*scale, '#00FF41', scale, 12);
      });
      geom.extraIndices.forEach((vIdx) => {
        const p2 = v2[vIdx];
        drawBracketReticle(targetCtx, X(p2), Y(p2), 8 * scale, '#00A82B', scale);
      });
    }

    if (!isExport && state.snapPreview && state.mode === 'points') {
      const sp = state.snapPreview;
      drawBracketReticle(targetCtx, sp.x2 * w, sp.y2 * h, 8.5 * scale, '#9CFFAE', scale);
      if (sp.tag) drawLabel(targetCtx, sp.tag, sp.x2 * w + 12*scale, sp.y2 * h + 14*scale, '#9CFFAE', scale, 11);
    }

    if (applyViewTransform) targetCtx.restore();

    if (isExport && !state.tier.isPro) {
      drawWatermarkCanvas(targetCtx, w, h, state.tier.watermark || 'SECT_3D // CONSTRUCT');
    }

    return res;
  }

  function escXml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildExportSvg() {
    if (state.renderScene) return buildSceneSvg();
    const w = state.img ? state.img.naturalWidth : 1400;
    const h = state.img ? state.img.naturalHeight : Math.round(1400 * (state.imgH / state.imgW));
    const scale = Math.max(1, w / 650);
    const flags = getRenderFlags();
    const P = curPal();
    const res = computeSection();
    const { geom, basis, faceVisible, edgeVisible, poly, segVis } = res;
    const active = resolveActiveStepData(res);
    const X = p => +(p.x * w).toFixed(2);
    const Y = p => +(p.y * h).toFixed(2);
    const v2 = geom.v3.map(v => proj2D(v, basis));
    const hasPhoto = Boolean(state.img);

    const out = [];
    out.push(`<?xml version="1.0" encoding="UTF-8"?>`);
    out.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">`);
    out.push(`<defs>`);
    const pStep = +(11 * scale).toFixed(2);
    out.push(
      `<pattern id="hatch45" width="${pStep}" height="${pStep}" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">` +
      `<line x1="0" y1="0" x2="0" y2="${pStep}" stroke="${P.hatchSvg}" stroke-width="${(1.3*scale).toFixed(2)}" />` +
      `</pattern>`
    );
    out.push(`</defs>`);

    if (state.img) {
      const tmp = document.createElement('canvas');
      tmp.width = w; tmp.height = h;
      const tCtx = tmp.getContext('2d');
      tCtx.drawImage(state.img, 0, 0, w, h);
      if (flags.greenFilter) {
        tCtx.globalCompositeOperation = 'multiply';
        tCtx.fillStyle = '#00FF41';
        tCtx.fillRect(0, 0, w, h);
        tCtx.globalCompositeOperation = 'source-over';
        tCtx.fillStyle = 'rgba(0, 255, 65, 0.10)';
        tCtx.fillRect(0, 0, w, h);
      }
      const dataUrl = tmp.toDataURL('image/jpeg', 0.92);
      out.push(`<image href="${dataUrl}" x="0" y="0" width="${w}" height="${h}" />`);
    } else {
      out.push(`<rect x="0" y="0" width="${w}" height="${h}" fill="${P.bg}" />`);
      const step = 28 * Math.max(1, w / 840);
      out.push(`<g stroke="${P.grid}" stroke-width="1">`);
      for (let gx = step; gx < w; gx += step) out.push(`<line x1="${gx.toFixed(1)}" y1="0" x2="${gx.toFixed(1)}" y2="${h}" />`);
      for (let gy = step; gy < h; gy += step) out.push(`<line x1="0" y1="${gy.toFixed(1)}" x2="${w}" y2="${gy.toFixed(1)}" />`);
      out.push(`</g>`);
    }

    if (active.drawPoly && poly.length >= 3) {
      const poly2 = poly.map(p => proj2D(p, basis));
      const ptsAttr = poly2.map(p => `${X(p)},${Y(p)}`).join(' ');
      out.push(`<polygon points="${ptsAttr}" fill="${P.polyFill}" />`);
      if (flags.showHatch) {
        out.push(`<polygon points="${ptsAttr}" fill="url(#hatch45)" />`);
      }
    }

    if (!active.hideWire) {
      geom.edges.forEach(([i, j], idx) => {
        const dash = edgeVisible[idx] ? '' : ` stroke-dasharray="${(5*scale).toFixed(1)} ${(5*scale).toFixed(1)}"`;
        const col = edgeVisible[idx] ? P.edgeVis : P.edgeHid;
        const sw = ((edgeVisible[idx] ? 1.75 : 1.25) * scale).toFixed(2);
        if (hasPhoto) {
          const haloW = ((edgeVisible[idx] ? 3.4 : 2.6) * scale).toFixed(2);
          out.push(`<line x1="${X(v2[i])}" y1="${Y(v2[i])}" x2="${X(v2[j])}" y2="${Y(v2[j])}" stroke="${P.haloSoft}" stroke-width="${haloW}"${dash} stroke-linecap="round" />`);
        }
        out.push(`<line x1="${X(v2[i])}" y1="${Y(v2[i])}" x2="${X(v2[j])}" y2="${Y(v2[j])}" stroke="${col}" stroke-width="${sw}"${dash} stroke-linecap="round" />`);
      });

      if (flags.showLabels) {
        const fSize = (12 * scale).toFixed(1);
        const stW = (4 * scale).toFixed(1);
        geom.v3.forEach((_, i) => {
          const lx = (X(v2[i]) + 6 * scale).toFixed(1);
          const ly = (Y(v2[i]) - 6 * scale).toFixed(1);
          out.push(
            `<text x="${lx}" y="${ly}" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${fSize}" ` +
            `fill="${P.vLabel}" stroke="${P.halo}" stroke-width="${stW}" paint-order="stroke">${escXml(geom.labels[i])}</text>`
          );
        });
      }
    }

    const svgPoint = (p3, visible, r, label) => {
      const p2 = proj2D(p3, basis);
      const cx = X(p2), cy = Y(p2);
      const rOuter = (r + 1.5 * scale).toFixed(2);
      out.push(`<circle cx="${cx}" cy="${cy}" r="${rOuter}" fill="${P.halo}" />`);
      if (visible) {
        out.push(`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" fill="${P.point}" />`);
      } else {
        out.push(`<circle cx="${cx}" cy="${cy}" r="${r.toFixed(2)}" fill="${P.halo}" stroke="${P.point}" stroke-width="${(2.1*scale).toFixed(2)}" />`);
      }
      if (label) {
        const lx = (cx + r + 5 * scale).toFixed(1);
        const ly = (cy - r - 3 * scale).toFixed(1);
        out.push(
          `<text x="${lx}" y="${ly}" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="${(12.5*scale).toFixed(1)}" ` +
          `fill="${P.point}" stroke="${P.halo}" stroke-width="${(4*scale).toFixed(1)}" paint-order="stroke">${escXml(label)}</text>`
        );
      }
    };

    for (const ray of active.activeTraces) {
      const a2 = proj2D(ray.a, basis), b2 = proj2D(ray.b, basis);
      const dash = ray.visible ? '' : ` stroke-dasharray="${(4.5*scale).toFixed(1)} ${(4.5*scale).toFixed(1)}"`;
      if (hasPhoto) {
        out.push(`<line x1="${X(a2)}" y1="${Y(a2)}" x2="${X(b2)}" y2="${Y(b2)}" stroke="${P.haloSoft}" stroke-width="${(3.0*scale).toFixed(2)}"${dash} />`);
      }
      out.push(`<line x1="${X(a2)}" y1="${Y(a2)}" x2="${X(b2)}" y2="${Y(b2)}" stroke="${P.trace}" stroke-width="${(1.5*scale).toFixed(2)}"${dash} />`);
    }
    for (const tn of active.activeTraceNodes) {
      svgPoint(tn.p3, tn.visible, 4.5 * scale, tn.name);
    }

    const drawSegSvg = (a, b, vis) => {
      const dash = vis ? '' : ` stroke-dasharray="${(7*scale).toFixed(1)} ${(4.5*scale).toFixed(1)}"`;
      if (hasPhoto) {
        out.push(`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${P.halo}" stroke-width="${(4.6*scale).toFixed(2)}"${dash} stroke-linecap="round" />`);
      }
      out.push(`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" stroke="${P.poly}" stroke-width="${(2.6*scale).toFixed(2)}"${dash} stroke-linecap="round" />`);
    };

    if (active.drawPoly && poly.length >= 3) {
      const poly2 = poly.map(p => proj2D(p, basis));
      poly2.forEach((a, i) => drawSegSvg(a, poly2[(i + 1) % poly2.length], segVis[i]));
    } else if (active.partialSegs.length > 0) {
      active.partialSegs.forEach(s => drawSegSvg(proj2D(s.a, basis), proj2D(s.b, basis), s.visible));
    }

    active.activePts.forEach((kp) => {
      const vis = geom.faces.some((f, fi) => faceVisible[fi] && isPointOnFace(kp.p3, f, geom));
      svgPoint(kp.p3, vis, 5.2 * scale, kp.name);
    });

    out.push(`</svg>`);
    return out.join('\n');
  }

  function updateStepPlayerUI(res) {
    const player = document.getElementById('stepPlayer');
    const toggleBtn = document.getElementById('stepToggleBtn');
    const total = res.snapshots.length;
    state.lastStepCount = total;

    if (total === 0 || getRenderFlags().taskOnly) {
      player.style.display = 'none';
      return;
    }

    if (state.playStep !== null && state.playStep >= total) {
      state.playStep = null;
    }

    player.style.display = 'inline-flex';
    if (state.playStep === null) {
      toggleBtn.textContent = `ВСЕ [${total}]`;
      toggleBtn.classList.remove('active');
    } else {
      toggleBtn.textContent = `ШАГ ${state.playStep + 1}/${total}`;
      toggleBtn.classList.add('active');
    }
  }

  function draw() {
    if (state.renderScene) { drawSceneMode(); return; }
    canvas.width = state.imgW;
    canvas.height = state.imgH;
    const res = renderToContext(ctx, state.imgW, state.imgH, false);

    if (state.dragging && state.pointerPos) {
      const s = Math.min(state.imgW, state.imgH) * 0.25;
      const mx = (state.pointerPos.x * view.zoom + view.panX) * state.imgW;
      const my = (state.pointerPos.y * view.zoom + view.panY) * state.imgH;
      const lx = mx < state.imgW * 0.5 ? state.imgW - s - 10 : 10, ly = 10;
      ctx.save();
      ctx.fillStyle = '#000000';
      ctx.fillRect(lx, ly, s, s);
      ctx.beginPath(); ctx.rect(lx, ly, s, s); ctx.clip();
      ctx.drawImage(canvas, mx - s*0.25, my - s*0.25, s*0.5, s*0.5, lx, ly, s, s);
      ctx.restore();
      ctx.strokeStyle = '#00FF41'; ctx.lineWidth = 2; ctx.strokeRect(lx, ly, s, s);
      ctx.beginPath();
      ctx.moveTo(lx + s/2 - 10, ly + s/2); ctx.lineTo(lx + s/2 + 10, ly + s/2);
      ctx.moveTo(lx + s/2, ly + s/2 - 10); ctx.lineTo(lx + s/2, ly + s/2 + 10);
      ctx.lineWidth = 1.4; ctx.stroke();
      ctx.fillStyle = '#000000'; ctx.fillRect(lx + 2, ly + s - 16, 98, 14);
      ctx.fillStyle = '#00FF41'; ctx.font = '700 10px "JetBrains Mono", monospace';
      ctx.fillText(`X:${state.pointerPos.x.toFixed(2)} Y:${state.pointerPos.y.toFixed(2)}`, lx + 5, ly + s - 5);
    }

    updateStepPlayerUI(res);
    syncViewUi();

    document.getElementById('modePointsBtn').textContent = `02 // ТОЧКИ [${state.points.length}/3]`;
    const polyKind = res.poly.length >= 3 ? `${res.poly.length}-УГ.` : `ТОЧЕК ${state.points.length}/3`;
    const zoomTag = Math.abs(view.zoom - 1) > 0.05 ? ` · ${view.zoom.toFixed(1)}×` : '';
    document.getElementById('hudStatus').textContent = (state.mode === 'anchors' ? 'КАРКАС · ' : 'СЕЧЕНИЕ · ') + polyKind + zoomTag;
    document.getElementById('polyKindTag').textContent = res.poly.length >= 3 ? `[ ${res.poly.length}-УГОЛЬНИК ]` : '[ ОЖИДАНИЕ ]';

    const list = document.getElementById('stepsList');
    if (res.steps.length > 0) {
      list.innerHTML = res.steps.map((s, i) => {
        let cls = '';
        if (state.playStep !== null && res.snapshots.length > 0) {
          if (i === state.playStep) cls = ' class="step-active"';
          else if (i > state.playStep) cls = ' class="step-future"';
        }
        return `<li data-step="${i}"${cls}><span class="trace-idx">${String(i+1).padStart(2,'0')}&gt;</span><span>${s}</span></li>`;
      }).join('');
    } else {
      list.innerHTML = '<li><span class="trace-idx">01&gt;</span><span>Отметьте 3 точки. Новые точки построения автоматически получают имена X1, X2, X3...</span></li>';
    }

    const canSaveApi = Boolean(apiBase && tg?.initData && state.points.length === 3);
    const saveBtn = document.getElementById('saveToChatBtn');
    const sendBtn = document.getElementById('sendTgBtn');

    saveBtn.style.display = canSaveApi ? 'inline-flex' : 'none';
    if (!canSaveApi && tg && !tg.initData && tg.platform && tg.platform !== 'unknown' && state.points.length === 3) {
      sendBtn.style.display = 'inline-flex';
    } else {
      sendBtn.style.display = 'none';
    }
  }

  // ---------- 8. Ввод: колесо мыши, два пальца (pinch+pan), перетаскивание и 3D-ползунки ----------
  const activePointers = new Map();
  let pinchState = null;
  let panState = null;
  let pendingPoint = null;
  let suppressSingleUntil = 0;

  function clientToScreenNorm(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(1, rect.width);
    const h = Math.max(1, rect.height);
    return {
      sx: (clientX - rect.left) / w,
      sy: (clientY - rect.top) / h,
      rectW: w,
      rectH: h
    };
  }

  function screenNormToWorld(sx, sy, clamp = true) {
    const x = (sx - view.panX) / view.zoom;
    const y = (sy - view.panY) / view.zoom;
    return clamp
      ? { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)) }
      : { x, y };
  }

  function getNormPos(e) {
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    const { sx, sy } = clientToScreenNorm(cx, cy);
    return screenNormToWorld(sx, sy, true);
  }

  function bakeRotationIntoAnchors() {
    if (Math.abs(view.yawDeg) < 1e-4 && Math.abs(view.pitchDeg) < 1e-4) return;
    const tf = getActiveManualTransform();
    state.anchors = tf.anchors.map(a => ({ x: a.x, y: a.y }));
    state.flipDepth = tf.flipDepth;
    view.yawDeg = 0;
    view.pitchDeg = 0;
    syncViewUi();
  }

  function startPinch() {
    const pts = Array.from(activePointers.values());
    if (pts.length < 2) return;
    const [a, b] = pts;
    const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
    const mid = clientToScreenNorm(0.5 * (a.clientX + b.clientX), 0.5 * (a.clientY + b.clientY));
    pinchState = {
      startDist: Math.max(10, dist),
      startZoom: view.zoom,
      prevMidSx: mid.sx,
      prevMidSy: mid.sy
    };
    // При переходе в жест двумя пальцами отменяем случайное касание точкой/перетаскиванием
    pendingPoint = null;
    panState = null;
    if (state.dragging) {
      state.dragging = null;
      state.pointerPos = null;
      draw();
    }
    suppressSingleUntil = performance.now() + 260;
  }

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  document.getElementById('viewport').addEventListener('wheel', (e) => {
    e.preventDefault();
    const { sx, sy } = clientToScreenNorm(e.clientX, e.clientY);
    const factor = Math.exp(-e.deltaY * 0.0014);
    zoomAt(view.zoom * factor, sx, sy);
  }, { passive: false });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });

    if (activePointers.size >= 2) {
      startPinch();
      return;
    }

    if (performance.now() < suppressSingleUntil) return;

    const { sx, sy, rectW } = clientToScreenNorm(e.clientX, e.clientY);
    const pos = screenNormToWorld(sx, sy, true);
    state.pointerPos = pos;

    // Средняя/правая кнопка или Alt/Shift — всегда панорамирование
    if (e.button === 1 || e.button === 2 || e.altKey || e.shiftKey || state.renderScene) {
      panState = { pointerId: e.pointerId, lastSx: sx, lastSy: sy };
      return;
    }

    const hitR = (26 / rectW) / view.zoom;
    const geom = buildShapeGeom(state.shapeKey, state.extraBase);
    const tf = getActiveManualTransform();
    const basis = tf.basis;

    if (state.mode === 'anchors') {
      let best = null, bestD = hitR;
      tf.anchors.forEach((a, i) => {
        const d = Math.hypot(a.x - pos.x, a.y - pos.y);
        if (d < bestD) { bestD = d; best = { type: 'anchor', idx: i }; }
      });
      geom.extraIndices.forEach((vIdx, extraIdx) => {
        const p2 = proj2D(geom.v3[vIdx], basis);
        const d = Math.hypot(p2.x - pos.x, p2.y - pos.y);
        if (d < bestD) { bestD = d; best = { type: 'extra', idx: extraIdx }; }
      });
      if (best) {
        bakeRotationIntoAnchors();
        state.dragging = best;
      } else if (view.zoom > 1.01) {
        panState = { pointerId: e.pointerId, lastSx: sx, lastSy: sy };
      }
    } else {
      let best = -1, bestD = hitR;
      state.points.forEach((pt, i) => {
        const p2 = proj2D(pt.p3, basis);
        const d = Math.hypot(p2.x - pos.x, p2.y - pos.y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) {
        state.dragging = { type: 'point', idx: best };
      } else {
        // Откладываем постановку новой точки до pointerup, чтобы 2-пальцевый зум на мобиле не ставил лишнюю точку
        pendingPoint = {
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
          lastSx: sx,
          lastSy: sy,
          pos
        };
      }
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (activePointers.has(e.pointerId)) {
      activePointers.set(e.pointerId, { clientX: e.clientX, clientY: e.clientY });
    }

    if (activePointers.size >= 2 && pinchState) {
      e.preventDefault();
      const [a, b] = Array.from(activePointers.values());
      const dist = Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
      const mid = clientToScreenNorm(0.5 * (a.clientX + b.clientX), 0.5 * (a.clientY + b.clientY));

      // Сдвиг середины пальцев -> панорамирование
      view.panX += (mid.sx - pinchState.prevMidSx);
      view.panY += (mid.sy - pinchState.prevMidSy);
      pinchState.prevMidSx = mid.sx;
      pinchState.prevMidSy = mid.sy;

      const targetZoom = pinchState.startZoom * (dist / pinchState.startDist);
      zoomAt(targetZoom, mid.sx, mid.sy);
      return;
    }

    if (panState && panState.pointerId === e.pointerId) {
      e.preventDefault();
      const { sx, sy } = clientToScreenNorm(e.clientX, e.clientY);
      view.panX += (sx - panState.lastSx);
      view.panY += (sy - panState.lastSy);
      panState.lastSx = sx;
      panState.lastSy = sy;
      clampPan();
      draw();
      return;
    }

    if (pendingPoint && pendingPoint.pointerId === e.pointerId) {
      const moved = Math.hypot(e.clientX - pendingPoint.startX, e.clientY - pendingPoint.startY);
      if (moved > 12) {
        if (view.zoom > 1.01) {
          panState = { pointerId: e.pointerId, lastSx: pendingPoint.lastSx, lastSy: pendingPoint.lastSy };
          pendingPoint = null;
          const { sx, sy } = clientToScreenNorm(e.clientX, e.clientY);
          view.panX += (sx - panState.lastSx);
          view.panY += (sy - panState.lastSy);
          panState.lastSx = sx;
          panState.lastSy = sy;
          clampPan();
          draw();
          return;
        }
        pendingPoint = null;
      }
    }

    const pos = getNormPos(e);
    state.pointerPos = pos;
    if (state.dragging) {
      e.preventDefault();
      state.playStep = null;
      if (state.dragging.type === 'anchor') {
        state.anchors[state.dragging.idx] = pos;
      } else if (state.dragging.type === 'extra') {
        const basis = getBasis();
        const xy = solve2x2(basis.e1.x, basis.e2.x, basis.e1.y, basis.e2.y, pos.x - basis.O.x, pos.y - basis.O.y);
        if (xy) state.extraBase[state.dragging.idx] = xy;
      } else {
        const snap = findSnap3D(pos.x, pos.y);
        if (snap) state.points[state.dragging.idx].p3 = snap.p3;
      }
      draw();
    } else if (!state.renderScene && state.mode === 'points' && state.points.length < 3 && activePointers.size === 0) {
      state.snapPreview = findSnap3D(pos.x, pos.y);
      draw();
    }
  });

  function stopPointer(e) {
    const hadPointer = activePointers.has(e.pointerId);
    activePointers.delete(e.pointerId);

    if (pinchState) {
      if (activePointers.size < 2) {
        pinchState = null;
        suppressSingleUntil = performance.now() + 220;
      }
      if (activePointers.size === 0) {
        state.dragging = null;
        state.pointerPos = null;
        draw();
      }
      return;
    }

    if (panState && panState.pointerId === e.pointerId) {
      panState = null;
    }

    if (pendingPoint && pendingPoint.pointerId === e.pointerId) {
      const pp = pendingPoint;
      pendingPoint = null;
      if (hadPointer && performance.now() >= suppressSingleUntil && !state.renderScene && state.mode === 'points' && state.points.length < 3) {
        const moved = Math.hypot(e.clientX - pp.startX, e.clientY - pp.startY);
        if (moved <= 12) {
          const snap = findSnap3D(pp.pos.x, pp.pos.y);
          if (snap) {
            state.points.push({ p3: snap.p3 });
            state.playStep = null;
            try { tg?.HapticFeedback?.impactOccurred('light'); } catch (_) {}
            draw();
          }
        }
      }
    }

    if (state.dragging || state.pointerPos) {
      state.dragging = null;
      state.pointerPos = null;
      draw();
    }
  }
  window.addEventListener('pointerup', stopPointer);
  window.addEventListener('pointercancel', stopPointer);

  // Ползунки 3D-вращения и сброс вида
  document.getElementById('yawRange').addEventListener('input', (e) => {
    view.yawDeg = Number(e.target.value) || 0;
    state.snapPreview = null;
    syncViewUi();
    draw();
  });
  document.getElementById('pitchRange').addEventListener('input', (e) => {
    view.pitchDeg = Number(e.target.value) || 0;
    state.snapPreview = null;
    syncViewUi();
    draw();
  });
  document.getElementById('resetViewBtn').addEventListener('click', () => {
    resetView(true);
    try { tg?.HapticFeedback?.impactOccurred('light'); } catch (_) {}
  });

  document.getElementById('shapeBar').addEventListener('click', (e) => {
    const card = e.target.closest('.shape-slot');
    if (!card) return;
    applyShapeDefaults(card.dataset.shape);
    draw();
  });

  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        state.img = img;
        const k = img.width > 1200 ? 1200 / img.width : 1;
        state.imgW = Math.round(img.width * k);
        state.imgH = Math.round(img.height * k);
        rainCanvas.style.display = 'none';
        document.getElementById('clearPhotoBtn').style.display = 'inline-flex';
        document.getElementById('greenFilterWrap').style.display = 'inline-flex';
        resetView(false);
        draw();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('clearPhotoBtn').addEventListener('click', () => {
    state.img = null; state.imgW = 840; state.imgH = 580;
    document.getElementById('fileInput').value = '';
    document.getElementById('clearPhotoBtn').style.display = 'none';
    document.getElementById('greenFilterWrap').style.display = 'none';
    rainCanvas.style.display = 'block';
    requestAnimationFrame(tickRain);
    resetView(false);
    draw();
  });

  document.getElementById('flipBtn').addEventListener('click', () => { state.flipDepth = !state.flipDepth; draw(); });

  document.getElementById('resetRegBtn').addEventListener('click', () => {
    const meta = SHAPE_META[state.shapeKey];
    if (meta && meta.hasExtra) {
      state.extraBase = computeRegularExtraBase(meta.N);
      draw();
    }
  });

  function setMode(m) {
    state.mode = m;
    state.snapPreview = null;
    document.getElementById('modeAnchorBtn').classList.toggle('active', m === 'anchors');
    document.getElementById('modePointsBtn').classList.toggle('active', m === 'points');
    document.getElementById('anchorControls').style.display = m === 'anchors' ? 'flex' : 'none';
    document.getElementById('pointControls').style.display = m === 'points' ? 'flex' : 'none';
    draw();
  }

  document.getElementById('modeAnchorBtn').addEventListener('click', () => setMode('anchors'));
  document.getElementById('modePointsBtn').addEventListener('click', () => setMode('points'));
  document.getElementById('faceSideBtn').addEventListener('click', (e) => {
    state.preferBackFace = !state.preferBackFace;
    e.target.textContent = state.preferBackFace ? 'ГРАНЬ: ЗАД (○)' : 'ГРАНЬ: ПЕРЕД (●)';
  });
  document.getElementById('undoPointBtn').addEventListener('click', () => { state.points.pop(); state.playStep = null; draw(); });
  document.getElementById('clearPointsBtn').addEventListener('click', () => { state.points = []; state.playStep = null; draw(); });

  ['showHatchCb', 'showTraceCb', 'showLabelsCb', 'hideWireCb', 'taskOnlyCb', 'greenFilterCb', 'paperThemeCb'].forEach(id =>
    document.getElementById(id).addEventListener('change', () => {
      if (id === 'taskOnlyCb' && document.getElementById('taskOnlyCb').checked) {
        state.playStep = null;
      }
      draw();
    })
  );

  document.getElementById('stepPrevBtn').addEventListener('click', () => {
    const total = state.lastStepCount;
    if (total <= 0) return;
    if (state.playStep === null) state.playStep = total - 1;
    else if (state.playStep > 0) state.playStep -= 1;
    else state.playStep = null;
    draw();
  });

  document.getElementById('stepNextBtn').addEventListener('click', () => {
    const total = state.lastStepCount;
    if (total <= 0) return;
    if (state.playStep === null) state.playStep = 0;
    else if (state.playStep < total - 1) state.playStep += 1;
    else state.playStep = null;
    draw();
  });

  document.getElementById('stepToggleBtn').addEventListener('click', () => {
    if (state.lastStepCount <= 0) return;
    state.playStep = state.playStep === null ? 0 : null;
    draw();
  });

  document.getElementById('stepsList').addEventListener('click', (e) => {
    const li = e.target.closest('li[data-step]');
    if (!li || state.lastStepCount <= 0) return;
    const idx = Number(li.dataset.step);
    if (!Number.isFinite(idx)) return;
    state.playStep = state.playStep === idx ? null : idx;
    draw();
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = state.img ? state.img.naturalWidth : 1400;
    out.height = state.img ? state.img.naturalHeight : Math.round(1400 * (state.imgH / state.imgW));
    renderToContext(out.getContext('2d'), out.width, out.height, true);
    const triggerDownload = (href, revoke) => {
      const link = document.createElement('a');
      link.download = curPal().paper ? 'sechenie_tetrad.png' : 'sechenie_matrix.png';
      link.href = href;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      if (revoke) setTimeout(() => URL.revokeObjectURL(href), 1500);
    };
    if (out.toBlob) {
      out.toBlob((blob) => {
        if (blob) triggerDownload(URL.createObjectURL(blob), true);
        else triggerDownload(out.toDataURL('image/png'), false);
      }, 'image/png');
    } else {
      triggerDownload(out.toDataURL('image/png'), false);
    }
  });

  document.getElementById('exportSvgBtn').addEventListener('click', () => {
    if (!state.tier.isPro) {
      setNetStatus('[ SVG-ЭКСПОРТ БЕЗ ВОДЯНОГО ЗНАКА — ФУНКЦИЯ PRO. PNG доступен бесплатно ]', true);
      try { tg?.HapticFeedback?.notificationOccurred('warning'); } catch (_) {}
      const bu = state.tier.botUsername;
      if (bu && tg?.openTelegramLink) {
        try { tg.openTelegramLink(`https://t.me/${bu}?start=buy`); } catch (_) {}
      }
      return;
    }
    const svgStr = buildExportSvg();
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = 'sechenie_construct.svg';
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  });

  document.getElementById('saveToChatBtn').addEventListener('click', async () => {
    if (!apiBase || !tg?.initData || state.points.length < 3) return;
    const btn = document.getElementById('saveToChatBtn');
    const flags = getRenderFlags();
    const tf = getActiveManualTransform();
    btn.disabled = true;
    btn.textContent = '> ОТПРАВКА...';
    setNetStatus('[ РЕНДЕР И ОТПРАВКА В ЧАТ... ]');

    const payload = {
      initData: tg.initData,
      presetId: state.presetId,
      state: {
        shape: state.shapeKey,
        aspect: +(state.imgW / Math.max(1, state.imgH)).toFixed(4),
        anchors: tf.anchors.map(a => [+a.x.toFixed(4), +a.y.toFixed(4)]),
        extraBase: state.extraBase.map(xy => [+xy[0].toFixed(4), +xy[1].toFixed(4)]),
        points3: state.points.map(p => p.p3.map(v => +v.toFixed(4))),
        ptNames: ptNames.slice(0, 3),
        flipDepth: Boolean(tf.flipDepth),
        showHatch: flags.showHatch,
        showTrace: flags.showTrace,
        showLabels: flags.showLabels,
        hideWire: flags.hideWire,
        greenFilter: flags.greenFilter
      }
    };

    try {
      const resp = await fetch(`${apiBase}/api/render`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        const errMap = {
          too_fast: `Слишком часто — подождите ${data.retryAfter || 4} сек.`,
          hourly_limit_reached: 'Достигнут часовой лимит перерисовок.',
          preset_render_limit: 'Достигнут лимит перерисовок для этого пресета.',
          unauthorized: 'Ошибка проверки подписи Telegram initData.'
        };
        throw new Error(errMap[data.error] || data.error || `HTTP ${resp.status}`);
      }
      if (data.presetId) state.presetId = data.presetId;
      setNetStatus('[ ОТПРАВЛЕНО В ЧАТ ]');
      btn.textContent = '> ОТПРАВЛЕНО';
      try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (_) {}
      setTimeout(() => {
        btn.textContent = '> СОХРАНИТЬ_В_ЧАТ';
        btn.disabled = false;
      }, 1500);
    } catch (err) {
      setNetStatus(`[ ОШИБКА: ${err.message} ]`, true);
      btn.textContent = '> СОХРАНИТЬ_В_ЧАТ';
      btn.disabled = false;
      try { tg?.HapticFeedback?.notificationOccurred('error'); } catch (_) {}
    }
  });

  document.getElementById('sendTgBtn').addEventListener('click', () => {
    if (!tg) return;
    const tf = getActiveManualTransform();
    tg.sendData(JSON.stringify({
      shape: state.shapeKey,
      aspect: +(state.imgW / Math.max(1, state.imgH)).toFixed(4),
      anchors: tf.anchors.map(a => [+a.x.toFixed(4), +a.y.toFixed(4)]),
      extraBase: state.extraBase,
      points3: state.points.map(p => p.p3.map(v => +v.toFixed(4))),
      ptNames: ptNames.slice(0, 3),
      flipDepth: Boolean(tf.flipDepth)
    }));
  });

  document.getElementById('sceneRecalcBtn').addEventListener('click', recalcScene);
  document.getElementById('sceneExitBtn').addEventListener('click', exitSceneMode);
  document.getElementById('scenePaperCb').addEventListener('change', () => draw());

  window.addEventListener('resize', () => { if (!state.img && !state.renderScene) initRain(); });
  syncViewUi();
  draw();
  initRain();
  requestAnimationFrame(tickRain);
  loadRemotePresetIfNeeded();
  loadTierIfPossible();
})();
</script>
</body>
</html>
